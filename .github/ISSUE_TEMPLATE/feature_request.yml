name: Feature request
description: Suggest a new feature or a change in behavior.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why is it hard or impossible now?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like it to work. An API sketch in Lua is welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use now, or other approaches you thought of.
  - type: dropdown
    id: contribute
    attributes:
      label: Would you send a pull request for this?
      options:
        - "Yes"
        - "Maybe, with guidance"
        - "No"
